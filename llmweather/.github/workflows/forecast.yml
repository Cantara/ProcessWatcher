# Hourly forecast: collect observations, build the site, publish to GitHub Pages.
#
# This workflow lives inside llmweather/.github/ so it becomes active the moment the folder is
# promoted to its own repository root. GitHub only runs workflows found at the repository root,
# so it is inert while LLMWeather is sideloaded inside another repository.
name: Forecast

on:
  schedule:
    - cron: "17 * * * *"
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  # Pages URL of this repository; the previous history.json is fetched from here so the
  # collector can compute pressure trends and fronts without committing data to git.
  SITE_URL: https://cantara.github.io/LLMWeather
  BASE_PATH: /LLMWeather/

jobs:
  forecast:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Restore previous history
        run: |
          mkdir -p .history
          curl -fsSL "$SITE_URL/data/history.json" -o .history/history.json || echo "no previous history (first run)"

      - name: Build collector
        run: mvn -B -q -f collector/pom.xml package

      - name: Collect observations and write forecast
        env:
          # Optional. Each key enables one API probe; the Anthropic key also enables the LLM-written bulletin.
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          COHERE_API_KEY: ${{ secrets.COHERE_API_KEY }}
        run: java -jar collector/target/llmweather-collector.jar --history .history --out site/public/data --llm

      - name: Build site
        working-directory: site
        run: |
          npm ci
          npm run build

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist
      - id: deploy
        uses: actions/deploy-pages@v4
